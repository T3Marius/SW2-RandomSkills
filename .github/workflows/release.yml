name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      repository-projects: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get tag name
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"

          # Find the previous tag reachable from the current tag's parent commit.
          # If none exists, treat this as the first release.
          if PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null); then
            TITLE="SW2-RandomSkill $VERSION"
            DESCRIPTION=$(git log "${PREVIOUS_TAG}..${VERSION}" --pretty=format:"- %s")

            if [ -z "$DESCRIPTION" ]; then
              DESCRIPTION="- No commits found between ${PREVIOUS_TAG} and ${VERSION}."
            fi
          else
            TITLE="SW2-RandomSkill $VERSION"
            DESCRIPTION="- Initial Release"
          fi
          
          # Write to file to handle multiline output
          echo "$TITLE" > release_title.txt
          echo "$DESCRIPTION" > release_description.txt
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Build project
        run: dotnet build --configuration Release
      
      - name: Prepare artifact
        run: |
          # Create directory with renamed folder
          mkdir -p artifacts
          cp -r build/net10.0 artifacts/SW2_RandomSkills
          cd artifacts
          zip -r SW2_RandomSkills.zip SW2_RandomSkills
          ls -lh SW2_RandomSkills.zip
      
      - name: Create Release with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(cat release_title.txt)
          DESCRIPTION=$(cat release_description.txt)
          VERSION="${{ steps.tag.outputs.version }}"
          
          gh release create "$VERSION" \
            --title "$TITLE" \
            --notes "$DESCRIPTION" \
            artifacts/SW2_RandomSkills.zip

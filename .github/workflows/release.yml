name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      repository-projects: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get tag name
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          if PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null); then
            TITLE="SW2-RandomSkill $VERSION"
            COMMIT_RANGE="${PREVIOUS_TAG}..${VERSION}"
          else
            TITLE="SW2-RandomSkill $VERSION"
            COMMIT_RANGE="${VERSION}"
          fi

          DESCRIPTION=""
          while IFS=$'\t' read -r COMMIT_SHA COMMIT_SUBJECT; do
            [ -z "$COMMIT_SHA" ] && continue

            SHORT_SHA="${COMMIT_SHA:0:7}"
            COMMIT_URL="${REPO_URL}/commit/${COMMIT_SHA}"
            FILE_LINKS=""

            while IFS= read -r FILE_PATH; do
              [ -z "$FILE_PATH" ] && continue
              FILE_URL="${REPO_URL}/blob/${COMMIT_SHA}/${FILE_PATH}"
              FILE_MD_LINK="[\`${FILE_PATH}\`](${FILE_URL})"

              if [ -z "$FILE_LINKS" ]; then
                FILE_LINKS="$FILE_MD_LINK"
              else
                FILE_LINKS="${FILE_LINKS}, ${FILE_MD_LINK}"
              fi
            done < <(git show --pretty="" --name-only --diff-filter=AMR "$COMMIT_SHA")

            LINE="- ${COMMIT_SUBJECT} ([\`${SHORT_SHA}\`](${COMMIT_URL}))"
            if [ -n "$FILE_LINKS" ]; then
              LINE="${LINE} - ${FILE_LINKS}"
            fi

            if [ -z "$DESCRIPTION" ]; then
              DESCRIPTION="$LINE"
            else
              DESCRIPTION="${DESCRIPTION}"$'\n'"${LINE}"
            fi
          done < <(git log "${COMMIT_RANGE}" --pretty=format:'%H%x09%s')

          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="- No commits found in ${COMMIT_RANGE}."
          fi

          # Write to file to handle multiline output
          echo "$TITLE" > release_title.txt
          echo "$DESCRIPTION" > release_description.txt
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Build project
        run: dotnet build --configuration Release
      
      - name: Prepare artifact
        run: |
          # Create directory with renamed folder
          mkdir -p artifacts
          cp -r build/net10.0 artifacts/SW2_RandomSkills
          cd artifacts
          zip -r SW2_RandomSkills.zip SW2_RandomSkills
          ls -lh SW2_RandomSkills.zip
      
      - name: Create Release with GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=$(cat release_title.txt)
          DESCRIPTION=$(cat release_description.txt)
          VERSION="${{ steps.tag.outputs.version }}"
          
          gh release create "$VERSION" \
            --title "$TITLE" \
            --notes "$DESCRIPTION" \
            artifacts/SW2_RandomSkills.zip
